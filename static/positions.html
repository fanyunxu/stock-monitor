<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>持仓</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #3C3F41; color: #d4d4d4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .container { max-width: 800px; margin: 0 auto; padding: 0 16px; background: #3C3F41; min-height: 100vh; }
    .meta { display: flex; gap: 16px; font-size: 0.8rem; color: #666; border-bottom: 1px solid #333; padding: 10px 0; }
    .meta span { display: flex; align-items: center; gap: 4px; }
    .count { margin-left: auto; color: #888; }
    #content { font-family: "JetBrains Mono", "Fira Code", "Consolas", monospace; font-size: 12px; line-height: 1.7; white-space: pre-wrap; word-break: break-all; color: #d4d4d4; background: transparent; }
    .up { color: #e06c75; }
    .down { color: #98c379; }
    .title { color: #61afef; font-weight: bold; }
    .divider { color: #555; }
    .indices { display: flex; gap: 24px; padding: 10px 0; border-bottom: 1px solid #333; font-size: 13px; flex-wrap: wrap; }
    .idx-item { display: flex; flex-direction: column; }
    .idx-name { color: #888; font-size: 0.75rem; }
    .idx-price { font-weight: 600; font-size: 1.05rem; }
    .idx-change { font-size: 0.8rem; color: #888; }
  </style>
</head>
<body>
<div class="container">
  <div class="indices" id="indices">
    <div class="idx-item"><span class="idx-name">上证指数</span><span class="idx-price">—</span><span class="idx-change">—</span></div>
    <div class="idx-item"><span class="idx-name">科创50</span><span class="idx-price">—</span><span class="idx-change">—</span></div>
    <div class="idx-item"><span class="idx-name">韩国KOSPI</span><span class="idx-price">—</span><span class="idx-change">—</span></div>
    <div class="idx-item"><span class="idx-name">日经225</span><span class="idx-price">—</span><span class="idx-change">—</span></div>
  </div>
  <div class="meta" id="meta">
    <span>⏱ <span id="lastRefresh">—</span></span>
  </div>
  <pre id="content">加载中...</pre>
</div>

<script>
const API = '/api'
const INDICES_INTERVAL = 5
const POSITIONS_INTERVAL = 1

let indicesTimer = null
let positionsTimer = null

function fmtTime(date) {
  return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
}

async function loadIndices() {
  try {
    const [shR, kcR, krR, nkR] = await Promise.all([
      fetch(`${API}/market/index`).then(r => r.json()),
      fetch(`${API}/kechuang_index`).then(r => r.json()),
      fetch(`${API}/korea_index`).then(r => r.json()),
      fetch(`${API}/nikkei_index`).then(r => r.json()),
    ])

    const container = document.getElementById('indices')
    const items = container.querySelectorAll('.idx-item')

    function fmtIdx(item, data, name) {
      if (data.error) {
        item.querySelector('.idx-name').textContent = '?'
        item.querySelector('.idx-price').textContent = '—'
        item.querySelector('.idx-change').textContent = ''
        return
      }

      if (data.current_price != null) {
        const price = data.current_price.toFixed(0)
        const sign = data.price_change >= 0 ? '+' : ''
        const chg = `${sign}${data.price_change.toFixed(0)}  ${sign}${data.price_change_percent.toFixed(2)}%`
        item.querySelector('.idx-name').textContent = data.name || name
        item.querySelector('.idx-price').textContent = price
        item.querySelector('.idx-change').textContent = chg
      }
      else if (data.price != null) {
        const price = data.price.toFixed(0)
        const sign = data.change >= 0 ? '+' : ''
        const chg = `${sign}${data.change.toFixed(2)}%`
        item.querySelector('.idx-name').textContent = data.name || name
        item.querySelector('.idx-price').textContent = price
        item.querySelector('.idx-change').textContent = chg
      }
    }

    fmtIdx(items[0], shR, '上证指数')
    fmtIdx(items[1], kcR, '科创50')
    fmtIdx(items[2], krR, '韩国KOSPI')
    fmtIdx(items[3], nkR, '日经225')
  } catch (e) {
    // silently fail, indices are non-critical
  }
}

async function loadPositions() {
  try {
    const r = await fetch(`${API}/stocks/positions`)
    if (!r.ok) throw new Error(r.statusText)
    const signals = await r.json()

    const holdings = signals

    const lines = []
    if (holdings.length === 0) {
      lines.push('')
    } else {
      holdings.forEach(s => {
        const price = s.current_price != null ? s.current_price.toFixed(3) : '—'
        const change = s.daily_return != null
          ? (s.daily_return >= 0 ? `+${s.daily_return.toFixed(2)}%` : `${s.daily_return.toFixed(2)}%`)
          : '—'
        const profitVal = s.profit_loss != null ? Math.round(s.profit_loss) : null
        let profitStr = '—'
        if (profitVal !== null) {
          if (profitVal > 0) profitStr = `+${profitVal}`
          else if (profitVal < 0) profitStr = `${profitVal}`
          else profitStr = '0'
        }
        const cost = s.cost != null ? s.cost.toFixed(3) : '—'

        const changeClass = s.daily_return >= 0 ? 'up' : 'down'
        const profitClass = s.profit_loss >= 0 ? 'up' : 'down'

        lines.push(`${s.name || s.symbol}（${s.symbol}）`)
        lines.push(`  ${price} ${changeClass == 'up' ? '▲' : '▼'} ${change}`)
      })
    }

    document.getElementById('content').textContent = lines.join('\n')

    const calcAt = signals.length > 0 && signals[0].calculated_at
      ? new Date(signals[0].calculated_at)
      : new Date()
    document.getElementById('lastRefresh').textContent = fmtTime(calcAt)
  } catch (e) {
    document.getElementById('content').textContent = '加载失败: ' + e.message
  }
}

let hidden = false
document.addEventListener('dblclick', () => {
  hidden = !hidden
  document.getElementById('content').style.display = hidden ? 'none' : 'block'
  document.getElementById('meta').style.display = hidden ? 'none' : 'flex'
  document.getElementById('indices').style.display = hidden ? 'none' : 'flex'
})

loadIndices()
loadPositions()
indicesTimer = setInterval(loadIndices, INDICES_INTERVAL * 1000)
positionsTimer = setInterval(loadPositions, POSITIONS_INTERVAL * 1000)
</script>
</body>
</html>
